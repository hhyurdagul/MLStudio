[workspace]
name = "MLStudio"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]
version = "0.1.0"

[tasks]
run = "python -m streamlit run mlstudio/main.py"

[dependencies]
python = ">=3.14"
pytorch = ">=2.12.0,<3"
xgboost = ">=3.3.0,<4"
numpy = ">=2.5.0,<3"
polars = ">=1.42.0,<2"
streamlit = ">=1.58.0,<2"
fastexcel = ">=0.20.2,<0.21"
xlsxwriter = ">=3.2.9,<4"
scikit-learn = ">=1.9.0,<2"
altair = ">=6.2.2,<7"
catboost = ">=1.2.10,<2"
