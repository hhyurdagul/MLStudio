[project]
name = "mlstudio"
version = "0.1.0"
description = "A Streamlit studio for regression training, validation, and testing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.2.1",
    "fastexcel>=0.20.2",
    "polars>=1.41.2",
    "scikit-learn>=1.9.0",
    "streamlit>=1.58.0",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "ty>=0.0.44",
]

[tool.ty.src]
exclude = ["mlstudio/plugins/feature_selection/score_functions.py"]
