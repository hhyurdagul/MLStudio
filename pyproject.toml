[project]
name = "mlstudio"
version = "0.1.0"
description = "A Streamlit studio for regression training, validation, and testing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "altair>=6.2.1",
  "catboost>=1.2.10",
  "fastexcel>=0.20.2",
  "polars>=1.41.2",
  "scikit-learn>=1.9.0",
  "scipy>=1.17.1",
  "streamlit>=1.58.0",
  "torch==2.11.0",
  "xgboost>=3.2.0; sys_platform == 'darwin'",
  "xgboost-cpu>=3.2.0; sys_platform != 'darwin'",
  "xlsxwriter>=3.2.9",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
